version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: smartcard-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartcard_pro
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartcard-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: smartcard-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smartcard_pro?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_refresh_key}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      QR_BASE_URL: ${QR_BASE_URL:-http://localhost:4200/card/}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartcard-net

  frontend:
    build: ./frontend
    container_name: smartcard-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - smartcard-net

volumes:
  postgres_data:

networks:
  smartcard-net:
